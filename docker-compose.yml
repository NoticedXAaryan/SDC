services:

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck: 
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - default

  migrator:
    build:
      context: .
      target: builder
    command: ["sh", "-c", "npx tsx scripts/migrate.ts && npx tsx scripts/set-owner.ts"]
    env_file: [.env]
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"
    networks:
      - default
      - dokploy-network

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    depends_on:
      redis: 
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379"
    restart: unless-stopped
    volumes:
      - app_uploads:/app/public/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sdc-main-router.rule=Host(`${APP_HOST:-sdc.aaaryan.space}`)"
      - "traefik.http.routers.sdc-main-router.entrypoints=websecure"
      - "traefik.http.routers.sdc-main-router.tls.certresolver=letsencrypt"
      - "traefik.http.services.sdc-main-service.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"
    networks:
      - default
      - dokploy-network

  worker:
    build: 
      context: .
      target: worker-runner
    depends_on: 
      redis: 
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    env_file: [.env]
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - app_uploads:/app/public/uploads
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  redis_data:
  app_uploads:
