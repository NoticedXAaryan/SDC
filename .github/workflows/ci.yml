name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TEST_DATABASE_URL: "postgresql://test:test@localhost:5432/club_test?sslmode=disable"
  DATABASE_URL: "postgresql://test:test@localhost:5432/club_test?sslmode=disable"
  BETTER_AUTH_SECRET: "ci-only-better-auth-secret-not-for-production"
  BETTER_AUTH_URL: "http://localhost:3000"
  PASS_SECRET: "ci-only-pass-secret-not-for-production"
  REDIS_URL: "redis://127.0.0.1:6379"
  DEV_MAILBOX_URL: "http://127.0.0.1:58025"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.30
        ports:
          - 58025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: club_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: 'npm'
      - name: Pin npm version
        run: npm install --global npm@10.9.4
      - run: npm --version
      - run: npm ci
      - run: npm run lint
      # Type analysis peaks around 1.5 GB for this project. Keep it on the CI
      # runner so the small production VPS only has to bundle validated code.
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile account journeys
        run: npx playwright test tests/e2e/auth.spec.ts tests/e2e/account-journey.spec.ts tests/e2e/membership-journey.spec.ts --reporter=line --global-timeout=420000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
