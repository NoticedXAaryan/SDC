name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "postgresql://test:test@localhost:5432/club_test"
  BETTER_AUTH_SECRET: "ci-only-better-auth-secret-not-for-production"
  BETTER_AUTH_URL: "http://localhost:3000"
  PASS_SECRET: "ci-only-pass-secret-not-for-production"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: club_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: 'npm'
      - name: Pin npm version
        run: npm install --global npm@10.9.4
      - run: npm --version
      - run: npm ci
      - run: npm run lint
      # Type analysis peaks around 1.5 GB for this project. Keep it on the CI
      # runner so the small production VPS only has to bundle validated code.
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
